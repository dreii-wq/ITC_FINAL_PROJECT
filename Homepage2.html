<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage | Edrian C. Dominguito</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Open Sans", sans-serif;
            background: linear-gradient(-45deg, #b3e5fc, #c8e6c9, #fff9c4, #f8bbd0);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 140px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            background-color: #1565c0;
            color: white;
            width: 100%;
            padding: 20px 0;
            font-family: "Montserrat", sans-serif;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
            position: fixed;
            top: 0;
            z-index: 10;
            animation: slideDown 0.7s ease;
        }

        header h1 {
            font-size: 2.2em;
            letter-spacing: 1px;
        }

        header h2 {
            font-size: 1.1em;
            color: #e3f2fd;
            font-weight: 500;
            margin-top: 5px;
        }

        header i {
            font-size: 0.9em;
            color: #bbdefb;
        }

   
        nav {
            margin-top: 12px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            text-decoration: none;
            color: #ffeb3b;
            font-weight: 600;
            font-size: 0.95em;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.3s, transform 0.2s, color 0.3s;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            transform: translateY(-2px);
        }

        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            animation: floatUp 20s infinite ease-in-out;
        }

        @keyframes floatUp {
            from { transform: translateY(0) scale(1); opacity: 1; }
            to { transform: translateY(-120vh) scale(1.3); opacity: 0; }
        }

        .content-box {
            width: 600px;
            max-width: 90%;
            margin-top: 60px;
            padding: 28px 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            color: #08304a;
            font-weight: 600;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: auto;
            padding: 20px;
            background-color: #1565c0;
            color: white;
            width: 100%;
            font-size: 0.9em;
        }
    </style>
</head>

<body>

            <a href="factorial.html">Factorial</a>
            <a href="payroll.html">Payroll</a>
        </nav>
    </header>

    <div class="shape" style="width:100px;height:100px;left:40%;animation-duration:25s;animation-delay:5s;"></div>
    <div class="shape" style="width:60px;height:60px;left:65%;animation-duration:20s;animation-delay:3s;"></div>
    <div class="shape" style="width:120px;height:120px;left:85%;animation-duration:30s;animation-delay:7s;"></div>
